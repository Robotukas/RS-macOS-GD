name: GDHub
options: {bundleIdPrefix: com.interlinked, deploymentTarget: {macOS: "14.0"}, createIntermediateGroups: true}
settings:
  base: {DEVELOPMENT_TEAM: 79XF6HYX8A, CODE_SIGN_STYLE: Automatic, MARKETING_VERSION: "0.1.0", CURRENT_PROJECT_VERSION: "1"}
targets:
  GDHub:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - Sources/GDHub
      - path: Shared                 # GDHubXlate.c: the translator shared with the dext (compiled into the dext from T5)
        excludes: [module.modulemap, GDHubDefaults.h]
      - Xcode/App/BundleModule+Xcode.swift
      - path: Xcode/Engine/com.interlinked.gdhub.engine.plist
        buildPhase: resources            # -> Contents/Resources/com.interlinked.gdhub.engine.plist
    dependencies: [{target: GDHubVirtualHID}]          # embedded in Contents/Library/SystemExtensions
    info:
      path: Xcode/App/Info.plist
      properties: {CFBundleDisplayName: GDHub, CFBundleShortVersionString: $(MARKETING_VERSION),
                   CFBundleVersion: $(CURRENT_PROJECT_VERSION), LSMinimumSystemVersion: "14.0",
                   NSPrincipalClass: NSApplication, NSHighResolutionCapable: true,
                   GDHubDextSourceHash: $(GDHUB_DEXT_SOURCE_HASH),   # what the embedded driver was built from (build-xcode.sh passes it)
                   NSSystemExtensionUsageDescription: "GDHub installs a driver that publishes its virtual controller, keyboard and pointer."}
    entitlements: {path: Xcode/App/GDHub.entitlements, properties: {com.apple.developer.system-extension.install: true}}
    settings:
      base: {PRODUCT_BUNDLE_IDENTIFIER: com.interlinked.gdhub, PRODUCT_NAME: GDHub, SWIFT_VERSION: "5.0",
             ENABLE_HARDENED_RUNTIME: YES, CODE_SIGN_IDENTITY: "Apple Development",
             SWIFT_OBJC_BRIDGING_HEADER: Xcode/App/GDHub-Bridging-Header.h,
             HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Shared"],
             OTHER_CFLAGS: ["$(inherited)", "-ffp-contract=off"]}      # the translator must not fuse multiply-adds (Swift does not)
  GDHubVirtualHID:
    type: driver-extension
    platform: macOS                                      # xcodegen has no DriverKit platform; SDKROOT does it
    sources:
      - Dext/GDHubVirtualHID
      # T5: the one C translator, compiled into the dext. Its multiplies and adds must not be fused (Swift's are not), so the
      # file gets -ffp-contract=off by name, and the whole target gets it too (OTHER_CFLAGS below). build-xcode.sh fails if the
      # compile commands of this file for the dext lack the flag.
      - path: Shared
        includes: [GDHubXlate.c]
        compilerFlags: ["-ffp-contract=off"]
    dependencies: [{sdk: DriverKit.framework}, {sdk: HIDDriverKit.framework}]
    info:
      path: Dext/GDHubVirtualHID/Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)   # = DEXT; xcodegen omits it for driver-extension
        CFBundleDisplayName: GDHub Virtual HID
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OSBundleUsageDescription: Publishes GDHub's virtual game controller, keyboard and pointer.
        IOKitPersonalities:
          GDHubVirtualHID:
            CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleIdentifierKernel: com.apple.kpi.iokit
            IOClass: IOUserService
            IOMatchCategory: $(PRODUCT_BUNDLE_IDENTIFIER)
            IOProviderClass: IOUserResources
            IOResourceMatch: IOKit
            IOUserClass: GDHubVirtualHID
            IOUserServerName: $(PRODUCT_BUNDLE_IDENTIFIER)
            IOUserServerOneProcess: true                        # T4: root and tap share one process (T0.2: proven with the probe)
            # T3: the pad is created by the ROOT (Create(root, "GDHubPadProperties")), so its properties sit at root level,
            # next to the user client's. They used to be nested in UserClientProperties.
            GDHubPadProperties: {IOClass: AppleUserHIDDevice, IOUserClass: GDHubVirtualPad}
            # D8/T11: GDHubKeyboardProperties / GDHubPointerProperties move up the same way
            UserClientProperties:
              IOClass: IOUserUserClient
              IOUserClass: GDHubVirtualHIDUserClient
          # T4: the receiver tap. It matches interface 3's IOHIDInterface only (page 0xFF58, usage 1; interface 4 is page 0x0C) of
          # the wireless receiver 3A08 (not 3A09 and not the wired products). Every key below is an INTEGER (xcodegen writes a YAML
          # integer as a plist integer; build-xcode.sh asserts it). IOProbeScore 1000 puts it at about 8200 against Apple's 1201.
          # No IOMatchCategory (it competes in the default category) and no Transport key.
          GDHubReceiverTap:
            CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleIdentifierKernel: com.apple.kpi.iokit
            IOClass: IOUserService
            IOProviderClass: IOHIDInterface
            IOUserClass: GDHubReceiverTap
            IOUserServerName: $(PRODUCT_BUNDLE_IDENTIFIER)
            IOUserServerOneProcess: true
            VendorID: 6940
            ProductID: 14856
            PrimaryUsagePage: 65368
            PrimaryUsage: 1
            IOProbeScore: 1000
    entitlements:
      path: Dext/GDHubVirtualHID/GDHubVirtualHID.entitlements
      properties: {com.apple.developer.driverkit: true, com.apple.developer.driverkit.family.hid.device: true,
                   com.apple.developer.driverkit.allow-any-userclient-access: true,
                   com.apple.developer.driverkit.transport.hid: true}      # T4: IOHIDInterface requires it for the tap
    settings:
      base: {PRODUCT_BUNDLE_IDENTIFIER: com.interlinked.gdhub.VirtualHID, PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER),
             SDKROOT: driverkit, SUPPORTED_PLATFORMS: driverkit, DRIVERKIT_DEPLOYMENT_TARGET: "23.0",
             CLANG_CXX_LANGUAGE_STANDARD: gnu++20,
             HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Shared"],
             OTHER_CFLAGS: ["$(inherited)", "-ffp-contract=off"],
             GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GDHUB_DEXT_BUILD=$(CURRENT_PROJECT_VERSION)", "GDHUB_TAP_DECLINE=0"],   # =1: the tap declines Start (rollback lever)
             ENABLE_HARDENED_RUNTIME: YES, CODE_SIGN_IDENTITY: "Apple Development"}
